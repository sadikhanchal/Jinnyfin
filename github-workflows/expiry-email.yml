# ============================================================================
#  Daily renewal check → e-mail.
#  Runs on GitHub's servers, free. Needs three repository secrets:
#    SUPABASE_URL        your project URL
#    SUPABASE_ANON_KEY   the anon public key
#    JINNYFIN_EMAIL          the e-mail you sign in with
#    JINNYFIN_PASSWORD       that account's password
#    RESEND_API_KEY      a free key from resend.com  (or swap in any mailer)
#    MAIL_TO             where the reminder should land
# ============================================================================
name: Insurance expiry reminder

on:
  schedule:
    - cron: '0 4 * * *'        # 07:00 in Riyadh (UTC+3)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Look for policies expiring soon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          JINNYFIN_EMAIL: ${{ secrets.JINNYFIN_EMAIL }}
          JINNYFIN_PASSWORD: ${{ secrets.JINNYFIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/check-expiry.mjs
