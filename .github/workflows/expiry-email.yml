name: Insurance expiry reminder

on:
  schedule:
    - cron: '0 4 * * *'        # 07:00 in Riyadh (UTC+3)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Look for policies expiring soon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          JINNYFIN_EMAIL: ${{ secrets.JINNYFIN_EMAIL }}
          JINNYFIN_PASSWORD: ${{ secrets.JINNYFIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/check-expiry.mjs
